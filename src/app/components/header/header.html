<header class="header">
  <a routerLink="/" class="header__brand" (click)="closeMenu()">
    MinhaLoja
  </a>

  <button
    type="button"
    class="header__toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="main-nav"
    aria-label="Abrir menu de navegação"
  >
    <span class="header__toggle-bar"></span>
    <span class="header__toggle-bar"></span>
    <span class="header__toggle-bar"></span>
  </button>

  <nav id="main-nav" class="header__nav" [class.header__nav--open]="isMenuOpen()">
    <ul>
      <li><a routerLink="/" (click)="closeMenu()">Catálogo</a></li>
    </ul>
  </nav>

  <a routerLink="/carrinho" class="header__cart" aria-label="Ver carrinho de compras" (click)="closeMenu()">
    <svg class="header__cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>

    @if (cartService.totalItems() > 0) {
      <span class="header__badge">{{ cartService.totalItems() }}</span>
    }
  </a>
</header>
