<article class="product-card">
  <a [routerLink]="['/produto', product.id]" class="product-card__link">
    <img [src]="product.imageUrl" [alt]="product.name" class="product-card__image" />
    <h3 class="product-card__name">{{ product.name }}</h3>
  </a>
  <p class="product-card__category">{{ product.category }}</p>
  <p class="product-card__price">R$ {{ product.price.toFixed(2) }}</p>
  <button type="button" class="product-card__button" (click)="addToCart()">
    Adicionar ao carrinho
  </button>
</article>
